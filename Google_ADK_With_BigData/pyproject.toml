[project]
name = "google-adk-bigdata-demo"
version = "0.1.0"
description = "Standalone Google ADK agent: SQLite, local research docs (FAISS + Gemini embeddings), and Bigdata.com MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "cryptography>=46.0.5",
    "langchain-community>=0.3.0",
    "langchain-core>=1.2.11",
    "faiss-cpu>=1.7.4",
    "langchain-google-genai>=4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["financial_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long SQL seed tuples and markdown-heavy system prompt exceed 100 cols.
"financial_agent/agent.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    # authlib (google-adk): full dotted category (see pytest ``_resolve_warning_category``).
    "ignore::authlib.deprecate.AuthlibDeprecationWarning",
    # google-adk: one-shot notice for default-on experimental PLUGGABLE_AUTH (google.adk.features).
    "ignore:.*PLUGGABLE_AUTH is enabled:UserWarning",
    # faiss-cpu SWIG bindings on Python 3.11+ (importlib) — upstream, harmless for tests.
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
