<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430" role="img" aria-labelledby="title desc">
  <title id="title">FX Forecast Report high-level workflow</title>
  <desc id="desc">Pair parameters flow into Bigdata.com MCP country and search data, then through six driver categories, weighted scoring, and finally a five-day forecast report.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="430" rx="24" fill="#f8fafc"/>
  <text x="700" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a">From pair inputs to a client-ready 5-day FX view</text>
  <text x="700" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#475569">Live evidence from Bigdata.com MCP + transparent weighted driver scoring</text>

  <!-- Step 1 -->
  <g filter="url(#shadow)">
    <rect x="40" y="120" width="230" height="220" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  </g>
  <circle cx="72" cy="150" r="17" fill="#334155"/>
  <text x="72" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="100" y="157" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Set the pair</text>
  <text x="64" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Base / quote countries</text>
  <text x="64" y="227" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Central banks</text>
  <text x="64" y="256" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Forecast horizon</text>
  <text x="64" y="285" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Sector terms</text>
  <text x="64" y="314" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Optional weights</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="230" x2="322" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow)">
    <rect x="335" y="100" width="280" height="260" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  </g>
  <circle cx="367" cy="130" r="17" fill="#2563eb"/>
  <text x="367" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="395" y="137" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#1e3a8a">Gather evidence</text>
  <rect x="360" y="168" width="230" height="70" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="475" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e40af">Country tearsheets</text>
  <text x="475" y="218" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">FX " macro " calendar " yields</text>
  <rect x="360" y="258" width="230" height="70" rx="12" fill="#ffffff" stroke="#93c5fd"/>
  <text x="475" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1e40af">Focused search</text>
  <text x="475" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#475569">Policy " flows " risks " positioning</text>
  <text x="475" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">Bigdata.com MCP</text>

  <!-- Arrow 2 -->
  <line x1="625" y1="230" x2="667" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow)">
    <rect x="680" y="100" width="300" height="260" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  </g>
  <circle cx="712" cy="130" r="17" fill="#7c3aed"/>
  <text x="712" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="740" y="137" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#4c1d95">Score six drivers</text>
  <text x="710" y="181" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Rate differential</text>
  <text x="710" y="211" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Trade &amp; capital flows</text>
  <text x="710" y="241" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Intervention risk</text>
  <text x="710" y="271" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Risk sentiment / carry</text>
  <text x="710" y="301" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Geopolitical</text>
  <text x="710" y="331" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#334155">Technical / positioning</text>

  <!-- Arrow 3 -->
  <line x1="990" y1="230" x2="1032" y2="230" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow)">
    <rect x="1045" y="120" width="315" height="220" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  </g>
  <circle cx="1077" cy="150" r="17" fill="#059669"/>
  <text x="1077" y="156" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="1105" y="157" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#065f46">Deliver the view</text>
  <text x="1072" y="202" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Direction + conviction</text>
  <text x="1072" y="232" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Weighted driver table</text>
  <text x="1072" y="262" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Event &amp; intervention risks</text>
  <text x="1072" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#334155">" Auditable source appendix</text>
  <text x="1202" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#059669">Client-ready forecast report</text>

  <text x="700" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Unsupported tearsheet countries automatically fall back to search-only evidence.</text>
</svg>
