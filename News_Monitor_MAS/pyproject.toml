[project]
name = "client-news-monitor"
version = "0.1.0"
description = "Retrieval-only news monitor PoC for US small/mid companies over fixed monitor topics"
requires-python = ">=3.11"
dependencies = [
    "bigdata-smart-batching>=1.3.1,<2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.scripts]
client-news-monitor = "src.client_monitor.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
